name: Deploy Lambda

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC 用
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Build Lambda ZIP
        run: |
          mkdir -p lambda/package
          pip install -r lambda/requirements.txt -t lambda/package/
          cp lambda/send_discord_notification.py lambda/package/
          cd lambda/package
          zip -r ../../terraform/lambda.zip .
          cd ..

      - name: Terraform Init & Apply
        env:
          TF_VAR_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${TF_VAR_WEBHOOK_URL//[[:space:]]/}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is required."
            exit 1
          fi
          cd terraform
          terraform init -input=false
          terraform apply -input=false -auto-approve
